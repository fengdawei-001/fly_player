name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch dependencies
        run: |
          flutter --version
          flutter pub get

      # 补齐 v7a 原生库：仓库 jniLibs 仅含 arm64-v8a，老 32 位设备无法运行
      # 采用官方 2026-03-22 release（mpv v0.41.0-360，与 arm64 内置 -264 同源最接近）
      - name: Add armeabi-v7a mpv libs (2026-03-22 official)
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cd /tmp
          curl -sLO https://github.com/mpv-android/mpv-android/releases/download/2026-03-22/app-default-armeabi-v7a-release.apk
          unzip -o -j app-default-armeabi-v7a-release.apk 'lib/armeabi-v7a/*.so' -d $GITHUB_WORKSPACE/android/app/src/main/jniLibs/armeabi-v7a/
          ls -la $GITHUB_WORKSPACE/android/app/src/main/jniLibs/armeabi-v7a/ | head -12

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      # flutter tool 偶发在产物落盘后误报 "failed to produce an .apk"，
      # 此步骤兜底定位真实产物位置（不存在时给出线索，不直接失败）
      - name: Locate APK (fallback)
        run: |
          echo "--- searching apk ---"
          find . -path '*build*' -name '*.apk' 2>/dev/null | head -20 || true
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "no default output dir"
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            **/app-release.apk
            **/*-release.apk
          if-no-files-found: warn
