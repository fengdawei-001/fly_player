name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable 3.47.2)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 仓库未提交 gradlew wrapper 脚本（仅 gradle-wrapper.properties），需自行提供 gradle
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Fetch dependencies & prepare gradle props
        run: |
          flutter --version
          flutter pub get
          echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          cat android/local.properties

      # 补齐 v7a 原生库：仓库 jniLibs 仅 arm64-v8a；官方 2026-03-22 v7a 与 arm64 内置 -264 同源最接近
      - name: Add armeabi-v7a mpv libs (2026-03-22 official)
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cd /tmp
          curl -sLO https://github.com/mpv-android/mpv-android/releases/download/2026-03-22/app-default-armeabi-v7a-release.apk
          unzip -o -j app-default-armeabi-v7a-release.apk 'lib/armeabi-v7a/*.so' -d $GITHUB_WORKSPACE/android/app/src/main/jniLibs/armeabi-v7a/
          ls -la $GITHUB_WORKSPACE/android/app/src/main/jniLibs/armeabi-v7a/ | head -12

      # 直接走 Gradle（仓库缺 gradlew 脚本，由 setup-gradle 提供 gradle 二进制），
      # 绕过 flutter build 工具层在 CI 的偶发 watcher 崩溃；
      # 指名构建 full×profile variant（对应 com.geqian.flyplayer.fly_player.profile，
      # 即设备在用的版本：flavor=full, buildType=profile）
      - name: Build release APK (gradle)
        run: |
          cd android
          gradle :app:assembleFullProfile --no-daemon
          echo "--- apk result ---"
          find . -path '*/build/outputs/*' -name '*.apk' -exec ls -la {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
